# =============================================================
# Pra Todos SP - configuracao
# NENHUMA credencial fica neste arquivo: tudo vem de variaveis de ambiente.
# Localmente, copie .env.example para .env e preencha (o .env nao vai para o GitHub).
# =============================================================
spring.application.name=pratodossp
spring.config.import=optional:file:.env[.properties]

# Porta: o Render informa a variavel PORT
server.port=${PORT:8080}
server.error.include-stacktrace=never
server.error.include-message=never
# No Render a aplicacao fica atras de um proxy HTTPS: usa os cabecalhos X-Forwarded-*
# para gerar links corretos (Swagger "Try it out" e cabecalho Location em https://)
server.forward-headers-strategy=framework

# ---------------- Oracle FIAP ----------------
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521/ORCL}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
# O Oracle da FIAP limita sessoes por aluno: pool pequeno
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:3}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000

# ---------------- JPA / Hibernate ----------------
# As tabelas sao criadas pelos scripts em src/main/resources/db (nao pelo Hibernate)
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50
# true = cria tabelas + dados ficticios na primeira subida, se a tabela PROMESSA nao existir
app.db.inicializar=${DB_INICIALIZAR:false}

# ---------------- Seguranca ----------------
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiracao-minutos=${JWT_EXPIRACAO_MINUTOS:120}
app.admin.nome=${ADMIN_NOME:Administrador}
app.admin.email=${ADMIN_EMAIL:}
app.admin.senha=${ADMIN_PASSWORD:}

# ---------------- Swagger ----------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# ---------------- Logs ----------------
logging.level.br.com.zynox=INFO
